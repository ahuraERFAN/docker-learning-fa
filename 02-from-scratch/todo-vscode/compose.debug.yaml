# Generated by the VS Code extension: run with the debugger (breakpoints inside the container)
services:
  todovscode:
    image: todovscode
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m uvicorn main:app --host 0.0.0.0 --port 8000"]
    ports:
      - 8002:8000
      - 5678:5678
